name: Deploy EWR adder site

# Publishes create_new_ewr/ as the GitHub Pages site (Settings → Pages → Source: GitHub Actions).
on:
  push:
    branches: [main]
    paths: ["create_new_ewr/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: create_new_ewr
      - id: deployment
        uses: actions/deploy-pages@v4
