name: New EWR from issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  add-ewr:
    if: startsWith(github.event.issue.title, 'New EWR:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: add
        run: node .github/scripts/add_ewr.mjs
      - name: Reject
        if: steps.add.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body-file result.md
          gh issue close "${{ github.event.issue.number }}" --reason "not planned"
      - name: Open pull request
        if: steps.add.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CODES: ${{ steps.add.outputs.codes }}
        run: |
          branch="new-ewr/issue-${{ github.event.issue.number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add py_ewr/parameter_metadata/parameter_sheet.csv create_new_ewr/parameter_sheet.csv \
            py_ewr/parameter_metadata/ewr_calc_config.json create_new_ewr/ewr_calc_config.json
          git commit -m "Add user-defined EWR(s): $CODES"
          git push origin "$branch"
          printf '%s\n\nCloses #%s\n' "$(cat result.md)" "${{ github.event.issue.number }}" > body.md
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" \
            --title "Add user-defined EWR(s): $CODES" --body-file body.md
